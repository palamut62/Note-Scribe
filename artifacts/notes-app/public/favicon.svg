<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Shine overlay -->
  <rect width="32" height="16" rx="8" fill="url(#shine)"/>

  <!-- Left stem of "n" -->
  <rect x="7" y="10" width="3.5" height="13" rx="1.75" fill="white"/>
  <!-- Arch connecting stems -->
  <path d="M10.5 13.5 C10.5 11.6 12 10 14 10 C16 10 17.5 11.6 17.5 13.5"
        stroke="white" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <!-- Right stem of "n" -->
  <rect x="14" y="13" width="3.5" height="10" rx="1.75" fill="white"/>

  <!-- Dot accent — nod to ".io" -->
  <circle cx="23.5" cy="22" r="2" fill="white" opacity="0.85"/>
</svg>
